<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>MVP de Tarefas</title>
    <link rel='icon' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%230f172a" width="100" height="100"/><circle cx="50" cy="50" r="45" fill="%2306b6d4"/><path d="M 35 50 L 45 60 L 65 40" stroke="%230f172a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' type='image/svg+xml'>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <div class="badge-pendentes">
      <span id="badge-number">0</span>
      <span>Pendentes</span>
    </div>

    <header>
    <h1>GDG Londrina - MVP de Tarefas</h1>
  </header>

  <main class="container">
    <!-- Adicionar Tarefa -->
    <section class="nova-tarefa" aria-label="Adicionar nova tarefa">
      <input id="nova-tarefa" type="text" placeholder="Digite a descrição da tarefa" aria-label="Nova tarefa" />
      <button id="btn-adicionar" type="button">Adicionar Tarefa:</button>
    </section>

    <!-- Contadores -->
    <section class="contadores" aria-label="Contadores de tarefas" style="margin: 16px 0;">
      <span>Pendentes: <strong id="contador-pendentes">0</strong></span>
      <span>Concluídas: <strong id="contador-concluidas">0</strong></span>
    </section>

    <!-- Lista de Tarefas -->
    <section class="lista-tarefas" aria-label="Lista de tarefas">
      <ul id="lista-tarefas" role="list"></ul>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Wesley Brene | MVP de Tarefas - GDG Londrina</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
